name: Build and publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    # Docs-only pushes keep the current image. Path filters are not evaluated
    # for tag pushes, so releases always publish. Pull requests are not
    # filtered: "Build multi-architecture image" is a required check.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Each platform builds natively on its own runner (no QEMU), boots the
  # image, and only then pushes it by digest. The merge job below joins the
  # digests into one multi-arch manifest under the published tags.
  build:
    name: Build image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # ---- Boot smoke test -------------------------------------------------
      # A green build is not a bootable image: issue #27 shipped an image
      # whose `prisma migrate deploy` crashed on missing modules before
      # server.js ever ran, and CI never noticed because it only built.
      # These steps load this platform's image, boot it against a scratch
      # Postgres and require /api/health to answer BEFORE anything is pushed.
      - name: Build image for boot test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: crawlseo-smoke:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

      - name: Boot smoke test
        run: |
          set -euo pipefail
          docker network create smoke
          docker run -d --name smoke-db --network smoke \
            -e POSTGRES_USER=crawlseo -e POSTGRES_PASSWORD=smoke -e POSTGRES_DB=crawlseo \
            postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec smoke-db pg_isready -U crawlseo >/dev/null 2>&1 && break
            sleep 1
          done
          # The image's CMD runs `prisma migrate deploy` before server.js, so
          # a 200 from /api/health proves: modules resolve, migrations apply,
          # the server starts, and it reaches the database.
          docker run -d --name smoke-app --network smoke -p 3000:3000 \
            -e DATABASE_URL=postgresql://crawlseo:smoke@smoke-db:5432/crawlseo \
            -e NEXTAUTH_SECRET=smoke-test-only \
            -e NEXTAUTH_URL=http://localhost:3000 \
            crawlseo-smoke:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health; then
              echo; echo "boot smoke test (${{ matrix.arch }}): OK"; exit 0
            fi
            sleep 2
          done
          echo "::error::${{ matrix.arch }} image did not serve /api/health within 60s: it builds but does not boot (the issue #27 failure mode)"
          echo "--- smoke-app logs ---"
          docker logs smoke-app
          exit 1
      # ---------------------------------------------------------------------

      - name: Push image by digest
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.push.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Keeps the name of the required status check. It runs even when a platform
  # build fails, so a failed build turns this check red instead of skipping it
  # (a skipped required check counts as passing).
  merge:
    name: Build multi-architecture image
    if: ${{ !cancelled() }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - name: Require both platform builds
        if: needs.build.result != 'success'
        run: |
          echo "::error::platform builds finished with '${{ needs.build.result }}'"
          exit 1

      - name: Download digests
        if: github.event_name != 'pull_request'
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # main pushes publish :edge and :sha-<short>. Version tags (v1.2.3)
          # publish :1.2.3, :1.2 and :sha-<short>, plus :latest, so :latest is
          # always the last release. With the default flavor latest=auto,
          # metadata-action adds :latest for semver tags only, and not for a
          # prerelease such as v1.3.0-rc.1.
          flavor: |
            latest=auto
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Create and push multi-arch manifest
        if: github.event_name != 'pull_request'
        working-directory: ${{ runner.temp }}/digests
        env:
          METADATA_JSON: ${{ steps.meta.outputs.json }}
        run: |
          set -euo pipefail
          digests=(*)
          if [ "${#digests[@]}" -ne 2 ]; then
            echo "::error::expected 2 digests, found: ${digests[*]}"
            exit 1
          fi
          args=()
          while IFS= read -r tag; do args+=(-t "$tag"); done < <(jq -r '.tags[]' <<< "$METADATA_JSON")
          for d in "${digests[@]}"; do args+=("${REGISTRY}/${IMAGE_NAME}@sha256:${d}"); done
          docker buildx imagetools create "${args[@]}"

      - name: Inspect published image
        if: github.event_name != 'pull_request'
        run: docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"
